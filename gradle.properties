org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 默认启用内置 Kotlin；本工程沿用 org.jetbrains.kotlin.android + Compose 编译器插件，
# 故按官方迁移指南临时关闭内置 Kotlin 与新 DSL（AGP 10 前可用）。
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official

# Release 签名（可选）。在 ~/.gradle/gradle.properties 或本文件中提供以下属性即可启用：
# KOMIRA_KEYSTORE=/absolute/path/to/release.jks
# KOMIRA_KEYSTORE_PASSWORD=...
# KOMIRA_KEY_ALIAS=...
# KOMIRA_KEY_PASSWORD=...
