name: Release

# 推送 vX.Y.Z 形式的 tag 时触发：构建 Android 的 debug 与 release 两个 APK 并挂到
# 对应的 GitHub Release 上。
#
# 与桌面端 release.yml 同构，但两端各为独立 git 仓库（android/ 与 desktop/），
# 故本 workflow 只管 Android 产物。
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_code: ${{ steps.resolve.outputs.version_code }}
    steps:
      - id: resolve
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag '${GITHUB_REF_NAME}' 不是 vX.Y.Z 形式，中止" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # versionCode 必须单调递增，系统据此判断能否覆盖安装。
          # 取 x*10000+y*100+z：保证递增，且为将来的次版本号留出间隔。
          # 注意首个 tag 会从仓库里的 4 跳到 10003 以上——Android 只要求严格递增，
          # 中间留空无妨（应用未正式发布过，没有历史用户会被卡住）。
          code="$(printf '%s' "$version" | awk -F. '{print $1*10000 + $2*100 + $3}')"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "打包版本：$version（versionCode=$code）"

  apk:
    name: Android (debug + release)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # release 签名属性。仓库内不含 keystore（.gitignore 排除 keystore/ 与 *.jks），
      # 故从 Secrets 取。缺失时 build.gradle.kts 的 signingConfig 不会启用，
      # 产出的是未签名 release APK——下面的上传步骤照常进行，不静默跳过。
      - name: Provide release signing secrets
        env:
          KOMIRA_KEYSTORE: ${{ secrets.KOMIRA_KEYSTORE }}
          KOMIRA_KEYSTORE_PASSWORD: ${{ secrets.KOMIRA_KEYSTORE_PASSWORD }}
          KOMIRA_KEY_ALIAS: ${{ secrets.KOMIRA_KEY_ALIAS }}
          KOMIRA_KEY_PASSWORD: ${{ secrets.KOMIRA_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KOMIRA_KEYSTORE:-}" ]; then
            echo "::warning::未提供 KOMIRA_KEYSTORE，release APK 将不签名"
            exit 0
          fi
          # Secrets 里存 base64，避免二进制文件无法放进 Secret 的问题。
          printf '%s' "$KOMIRA_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          # 必须带 ORG_GRADLE_PROJECT_ 前缀：build.gradle.kts 用 providers.gradleProperty(...)
          # 读取，Gradle 只把该前缀的环境变量当作项目属性；否则签名不生效、产出未签名 APK。
          {
            echo "ORG_GRADLE_PROJECT_KOMIRA_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "ORG_GRADLE_PROJECT_KOMIRA_KEYSTORE_PASSWORD=${KOMIRA_KEYSTORE_PASSWORD}"
            echo "ORG_GRADLE_PROJECT_KOMIRA_KEY_ALIAS=${KOMIRA_KEY_ALIAS}"
            echo "ORG_GRADLE_PROJECT_KOMIRA_KEY_PASSWORD=${KOMIRA_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"

      # debug 与 release 都出：debug 供局域网连自建模拟源（放行明文 ws://，
      # 见 src/debug/res/xml/network_security_config.xml），release 供分发。
      # 版本号取自 tag，避免产物内的 versionName 与 tag 不一致。
      - name: Build debug and release APKs
        run: |
          set -eu
          ./gradlew --no-daemon \
            -PversionName="${{ needs.version.outputs.version }}" \
            -PversionCode="${{ needs.version.outputs.version_code }}" \
            :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for variant in debug release; do
            src="app/build/outputs/apk/$variant/app-$variant.apk"
            if [ ! -f "$src" ]; then
              unsigned="app/build/outputs/apk/$variant/app-$variant-unsigned.apk"
              if [ -f "$unsigned" ]; then
                echo "$variant APK 未签名（$unsigned）：检查 KOMIRA_KEYSTORE 等签名 Secrets 是否生效" >&2
              fi
              echo "缺少产物 $src" >&2
              exit 1
            fi
            cp "$src" "dist/komiraquake_${VERSION}_${variant}.apk"
          done
          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [version, apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
